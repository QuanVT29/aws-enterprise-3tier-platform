version: 0.0
os: linux
files:
  - source: /
    destination: /opt/app
    exclude:
      - appspec.yml
      - scripts/user_data.sh
file_exists_behavior: OVERWRITE

permissions:
  - object: /opt/app
    owner: ec2-user
    group: ec2-user
    mode: 755

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root